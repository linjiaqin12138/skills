<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>命令量示意：机器人怎么动</title>
<style>
  :root { color-scheme: light; }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; background: #f4f1ea; color: #1c1915; }
  header, main { max-width: 1040px; margin: 0 auto; padding: 16px 20px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  canvas { width: 100%; background: #fffdf8; border: 1px solid #d9d2c5; border-radius: 8px; }
  label { display: grid; grid-template-columns: 92px 1fr 72px; gap: 6px; align-items: center; margin: 6px 0; font-size: 13px; }
  output { text-align: right; font-variant-numeric: tabular-nums; }
  button { margin: 4px 4px 0 0; padding: 4px 8px; border: 1px solid #b7ad9e; background: #fff; border-radius: 6px; cursor: pointer; }
  button.on { background: #1c1915; color: #fff; }
  .note { font-size: 13px; color: #5c564c; }
  .strip { font-family: ui-monospace, monospace; font-size: 12px; background: #fff; padding: 8px; border-radius: 6px; overflow-x: auto; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>命令块里的数，对应机器人怎么动</h1>
  <p>躯干坐标系：x 朝前，y 朝左，z 朝上。滑条一动，图就动。俯视图里的位置是速度乘时间积出来的，松手后它会停在那儿。</p>
  <p class="note">侧面和正面是一只示意鸭子：脚留在地上，下蹲时膝盖弯。嘴和两只眼睛用来看头 yaw / head roll。角度是真实弧度，没有放大。</p>
</header>
<main>
  <div class="layout">
    <div>
      <div id="sliders"></div>
      <button id="reset">回到原点</button>
      <button id="demo">走一个小圈</button>
      <p class="strip" id="strip"></p>
    </div>
    <canvas id="view" width="720" height="640"></canvas>
  </div>
</main>
<script>
const RANGES = {
  vx: ["向前 vx", "m/s", -0.3, 0.3, 0.01],
  vy: ["向左 vy", "m/s", -0.3, 0.3, 0.01],
  vyaw: ["左转 vyaw", "rad/s", -1.5, 1.5, 0.01],
  neck: ["颈 pitch", "rad", -0.6, 0.6, 0.01],
  hp: ["头 pitch", "rad", -0.6, 0.6, 0.01],
  hy: ["头 yaw", "rad", -1.2, 1.2, 0.01],
  hr: ["头 roll", "rad", -0.5, 0.5, 0.01],
  z: ["身高 z", "m", -0.025, 0.01, 0.001],
  roll: ["roll", "rad", -0.26, 0.26, 0.01],
  pitch: ["pitch", "rad", -0.26, 0.26, 0.01],
};
const cmd = { vx:0, vy:0, vyaw:0, neck:0, hp:0, hy:0, hr:0, z:0, roll:0, pitch:0 };
const pose = { x: 0, y: 0, yaw: 0, trail: [] };
const host = document.getElementById("sliders");
const outs = {};
for (const [key, [name, unit, min, max, step]] of Object.entries(RANGES)) {
  const lab = document.createElement("label");
  lab.innerHTML = `<span>${name}</span><input type="range" min="${min}" max="${max}" step="${step}" value="0"><output>0</output>`;
  const input = lab.querySelector("input");
  const output = lab.querySelector("output");
  outs[key] = output;
  input.addEventListener("input", () => { cmd[key] = Number(input.value); });
  host.appendChild(lab);
  cmd["input_"+key] = input;
}
function setCmd(partial) {
  for (const k of Object.keys(RANGES)) {
    const v = partial[k] ?? 0;
    cmd[k] = v;
    cmd["input_"+k].value = String(v);
  }
}
document.getElementById("reset").onclick = () => {
  setCmd({});
  pose.x = 0; pose.y = 0; pose.yaw = 0; pose.trail = [];
};
let demoUntil = 0;
document.getElementById("demo").onclick = () => {
  setCmd({ vx: 0.25, vyaw: 0.8 });
  demoUntil = performance.now() + 8000;
};

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (demoUntil && now > demoUntil) { setCmd({}); demoUntil = 0; }
  // 机体速度转到世界系。yaw 增大时鼻子从「上」转向「左」（逆时针）。
  const fx = -Math.sin(pose.yaw), fy = Math.cos(pose.yaw);
  const lx = -fy, ly = fx;
  pose.x += (fx * cmd.vx + lx * cmd.vy) * dt;
  pose.y += (fy * cmd.vx + ly * cmd.vy) * dt;
  pose.yaw += cmd.vyaw * dt;
  pose.trail.push([pose.x, pose.y]);
  if (pose.trail.length > 240) pose.trail.shift();
  for (const k of Object.keys(RANGES)) outs[k].textContent = cmd[k].toFixed(k === "z" ? 3 : 2);
  document.getElementById("strip").textContent =
    `obs[48..61]  ${[cmd.vx, cmd.vy, cmd.vyaw, cmd.neck, cmd.hp, cmd.hy, cmd.hr, 0, 0, cmd.z, cmd.roll, cmd.pitch, 0].map(v => v.toFixed(2)).join("  ")}`;
  draw();
  requestAnimationFrame(frame);
}

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#fffdf8";
  ctx.fillRect(0, 0, w, h);
  topView(16, 16, 688, 300);
  sideView(16, 332, 330, 290);
  frontView(370, 332, 330, 290);
}

function panel(x, y, w, h, title) {
  ctx.save();
  ctx.strokeStyle = "#d9d2c5";
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = "#5c564c";
  ctx.font = "13px system-ui";
  ctx.fillText(title, x + 8, y + 18);
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  return { x, y, w, h };
}

function topView(x, y, w, h) {
  const p = panel(x, y, w, h, "俯视  ·  上 = 前，左 = 左    正 vyaw 逆时针");
  const cx = x + w / 2, cy = y + h / 2 + 8;
  const s = 140;
  ctx.strokeStyle = "#e4ddd0";
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(cx + i * s, y + 28); ctx.lineTo(cx + i * s, y + h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, cy + i * s); ctx.lineTo(x + w, cy + i * s); ctx.stroke();
  }
  ctx.strokeStyle = "#c45c26";
  ctx.beginPath();
  pose.trail.forEach(([px, py], i) => {
    const sx = cx + px * s, sy = cy - py * s;
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  });
  ctx.stroke();
  ctx.translate(cx + pose.x * s, cy - pose.y * s);
  ctx.rotate(-pose.yaw);
  duckTop(0, 0, s);
  ctx.restore();
}

function duckTop(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "#f0c14a";
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0.01 * s, 0.055 * s, 0.04 * s, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -0.055 * s, 0.038 * s, 0.032 * s, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // 正 head yaw：嘴从「前」转向画面左侧（机器人的左）。
  const bx = -Math.sin(cmd.hy) * 0.055 * s;
  const by = -Math.cos(cmd.hy) * 0.055 * s;
  ctx.strokeStyle = "#c45c26";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -0.07 * s);
  ctx.lineTo(bx, by - 0.05 * s);
  ctx.stroke();
  ctx.restore();
}

function sideView(x, y, w, h) {
  panel(x, y, w, h, "侧面  ·  右 = 前    正 pitch 前倾，负 z 下蹲");
  const ground = y + h - 36;
  const px = 110;
  ctx.strokeStyle = "#1c1915";
  ctx.beginPath(); ctx.moveTo(x + 20, ground); ctx.lineTo(x + w - 16, ground); ctx.stroke();
  ctx.save();
  ctx.translate(x + w / 2, ground);
  ctx.scale(px / 0.12, -px / 0.12);
  bodySide();
  ctx.restore();
  ctx.restore();
}

function frontView(x, y, w, h) {
  panel(x, y, w, h, "正面  ·  画面左侧 = 机器人的左    正 roll 左侧抬起");
  const ground = y + h - 36;
  const px = 110;
  ctx.strokeStyle = "#1c1915";
  ctx.beginPath(); ctx.moveTo(x + 20, ground); ctx.lineTo(x + w - 16, ground); ctx.stroke();
  ctx.save();
  ctx.translate(x + w / 2, ground);
  ctx.scale(px / 0.12, -px / 0.12);
  bodyFront();
  ctx.restore();
  ctx.restore();
}

function bodySide() {
  const hipZ = 0.12 + cmd.z;
  foot(-0.02, 0.035);
  ctx.save();
  ctx.rotate(cmd.pitch);
  const knee = bend({ x: 0, y: hipZ }, { x: 0, y: 0 }, 0.075, 1);
  bone(0, hipZ, knee.x, knee.y);
  bone(knee.x, knee.y, 0, 0);
  ctx.translate(0, hipZ);
  torsoSide();
  ctx.restore();
}

function bodyFront() {
  const hipZ = 0.12 + cmd.z;
  foot(-0.055, 0.03);
  foot(0.025, 0.03);
  ctx.save();
  ctx.rotate(-cmd.roll);
  const left = bend({ x: -0.028, y: hipZ }, { x: -0.04, y: 0 }, 0.075, -1);
  const right = bend({ x: 0.028, y: hipZ }, { x: 0.04, y: 0 }, 0.075, 1);
  bone(-0.028, hipZ, left.x, left.y);
  bone(left.x, left.y, -0.04, 0);
  bone(0.028, hipZ, right.x, right.y);
  bone(right.x, right.y, 0.04, 0);
  ctx.translate(0, hipZ);
  torsoFront();
  ctx.restore();
}

function torsoSide() {
  ctx.fillStyle = "#f0c14a";
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = 0.006;
  ctx.beginPath();
  ctx.ellipse(0, 0.02, 0.045, 0.05, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-0.04, 0.01, 0.016, 0.012, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.translate(0.01, 0.055);
  ctx.rotate(cmd.neck);
  bone(0, 0, 0.012, 0.035);
  ctx.translate(0.012, 0.035);
  ctx.rotate(cmd.hp);
  headSide();
  ctx.restore();
}

function headSide() {
  const yaw = cmd.hy;
  ctx.beginPath();
  ctx.ellipse(0, 0.02, 0.032, 0.03, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  const beak = 0.045 * Math.max(0.15, Math.cos(yaw));
  ctx.fillStyle = "#e07a3d";
  ctx.beginPath();
  ctx.moveTo(0.02, 0.028);
  ctx.lineTo(0.02 + beak, 0.02);
  ctx.lineTo(0.02, 0.01);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  eye(0.012, 0.03, 0.007);
}

function torsoFront() {
  ctx.fillStyle = "#f0c14a";
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = 0.006;
  ctx.beginPath();
  ctx.ellipse(0, 0.025, 0.05, 0.055, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 0.07);
  ctx.stroke();
  ctx.save();
  ctx.translate(0, 0.09);
  ctx.rotate(-cmd.hr);
  headFront();
  ctx.restore();
}

function headFront() {
  const yaw = cmd.hy;
  ctx.beginPath();
  ctx.ellipse(0, 0.02, 0.034, 0.032, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  const slide = -Math.sin(yaw) * 0.012;
  eye(-0.014 + slide, 0.03, 0.006 * (1 + Math.max(0, -Math.sin(yaw))));
  eye(0.014 + slide, 0.03, 0.006 * (1 + Math.max(0, Math.sin(yaw))));
  ctx.fillStyle = "#e07a3d";
  ctx.beginPath();
  ctx.moveTo(slide - 0.01, 0.012);
  ctx.lineTo(-Math.sin(yaw) * 0.05, 0.006);
  ctx.lineTo(slide + 0.01, 0.012);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function eye(x, y, r) {
  ctx.save();
  ctx.fillStyle = "#fffdf8";
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#1c1915";
  ctx.beginPath();
  ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function foot(x, w) {
  ctx.save();
  ctx.fillStyle = "#e07a3d";
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = 0.005;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, 0.006, w / 2, 0.008, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function bone(x1, y1, x2, y2) {
  ctx.save();
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = 0.01;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function bend(hip, footPt, len, side) {
  const dx = footPt.x - hip.x, dy = footPt.y - hip.y;
  const dist = Math.hypot(dx, dy) || 1e-6;
  const half = Math.min(len, dist / 2);
  const h = Math.sqrt(Math.max(0, len * len - half * half));
  const mx = (hip.x + footPt.x) / 2, my = (hip.y + footPt.y) / 2;
  const nx = -dy / dist, ny = dx / dist;
  return { x: mx + side * h * nx, y: my + side * h * ny };
}

requestAnimationFrame(frame);
</script>
</body>
</html>
