[package]
name = "miniduck"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "miniduckd"
path = "src/main.rs"

[[bin]]
name = "mini-updaterd"
path = "src/bin/mini-updaterd.rs"

[[example]]
name = "ex_onnx_session"
path = "examples/ex_onnx_session.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# load-dynamic：运行时 dlopen libonnxruntime；钉死与板端一致的 rc。
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
# M7 updater：sha256 完整性校验（pure-Rust 小 crate；minisign 验签是 D38，M8 裁决）。
sha2 = "0.10"
# M7 updater：flock 单飞锁 + SIGTERM/SIGKILL + setsid，全在 libc 里（已在依赖树中）。
libc = "0.2"
