services:
  rust:
    build:
      context: ./docker
      args:
        UID: "1000"
        GID: "1000"
    image: miniduck-rust:dev
    container_name: miniduck-rust
    # 宿主机是 rootless docker：容器 uid 0 映射到宿主机当前用户，
    # bind mount 的 /work 里宿主文件在容器内显示为 root——以 root 跑
    # 才能写 target/，且产物落回宿主机仍属当前用户。传统（rootful）
    # docker 下应删掉这行并改用 build args UID/GID=宿主机 uid/gid。
    user: "0:0"
    working_dir: /work
    environment:
      # ort load-dynamic；与 scripts/fetch-m3.sh 摊平后的路径一致。
      ORT_DYLIB_PATH: /work/third_party/onnxruntime/lib/libonnxruntime.so
    volumes:
      - .:/work
      - cargo-home:/cargo
    ports:
      # 7802：sim/duck_body.py --view-port 的 MJPEG 网页画面（浏览器看鸭子）
      - "127.0.0.1:7802:7802"
      # 6080：scripts/duck-vnc.sh 的 noVNC 远程桌面（浏览器交互推鸭子）：
      # 容器里跑 bash scripts/duck-vnc.sh，浏览器打开 http://localhost:6080/vnc.html
      - "127.0.0.1:6080:6080"
    tty: true
    stdin_open: true

volumes:
  cargo-home:
