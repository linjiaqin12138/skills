<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#0F172A}.subtitle{font-size:15px;fill:#475569}.container-label{font-size:16px;font-weight:700;fill:#334155}.node-label{font-size:16px;font-weight:700}.node-line{font-size:13px}.edge-label{font-size:12px;fill:#334155}.legend{font-size:13px;fill:#475569}</style>
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#64748B"/></marker>
<marker id="arrow-pink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#DB2777"/></marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#D97706"/></marker>
<marker id="arrow-light" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#CBD5E1"/></marker>
</defs>
<rect width="1400" height="980" fill="#FFFFFF"/>
<text class="title" x="40" y="45">miniduckd · odometry 子模块</text>
<text class="subtitle" x="40" y="75">每拍一次：样本 → FK → 由当前锚点投影 → 候选扫描 → pending/确认 → 估计 · 无接触力 / 无陀螺积分</text>
<rect id="p_daemon" x="40" y="120" width="1180" height="780" rx="12" fill="#F8FAFC" fill-opacity="0.45" stroke="#94A3B8" stroke-width="1.5" data-graph-role="container" data-container-id="p_daemon" data-graph-bounds="40,120,1220,900"/>
<text class="container-label" x="56" y="145">miniduckd · impl/src/odometry.rs</text>
<path id="sample-fk" d="M 210 330 L 210 370" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="sample-fk" data-source="sample" data-target="fk" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<path id="fk-project" d="M 340 420 L 395 420 L 395 270 L 450 270" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="fk-project" data-source="fk" data-target="project" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="project-scan" d="M 600 360 L 600 410" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="project-scan" data-source="project" data-target="scan" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<path id="scan-pending" d="M 750 480 L 790 480 L 790 380 L 830 380" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="scan-pending" data-source="scan" data-target="pending" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="pending-project" d="M 940 280 L 940 140 L 560 140 L 560 180" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="pending-project" data-source="pending" data-target="project" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="pending-out" d="M 940 500 L 940 560" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="pending-out" data-source="pending" data-target="out" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<g data-graph-role="node" data-node-id="sample" data-graph-bounds="80,180,340,330">
<rect id="sample" x="80" y="180" width="260" height="150" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="210.0" y="207" text-anchor="middle" fill="#FFFFFF">输入 · 每拍样本</text>
<text class="node-line" x="210.0" y="233" text-anchor="middle" fill="#FFFFFF">15 关节角（嘴忽略）</text>
<text class="node-line" x="210.0" y="256" text-anchor="middle" fill="#FFFFFF">IMU 四元数 wxyz</text>
<text class="node-line" x="210.0" y="279" text-anchor="middle" fill="#FFFFFF">只吃 fresh ∧ imu_ready 拍</text>
</g>
<g data-graph-role="node" data-node-id="fk" data-graph-bounds="80,370,340,520">
<rect id="fk" x="80" y="370" width="260" height="150" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="210.0" y="397" text-anchor="middle" fill="#FFFFFF">FK · Alpha 双足链</text>
<text class="node-line" x="210.0" y="423" text-anchor="middle" fill="#FFFFFF">5 链接 × 2 腿 · 固定 rest</text>
<text class="node-line" x="210.0" y="446" text-anchor="middle" fill="#FFFFFF">输出两脚 site 位姿</text>
<text class="node-line" x="210.0" y="469" text-anchor="middle" fill="#FFFFFF">不依赖通用 kinematics</text>
</g>
<g data-graph-role="node" data-node-id="project" data-graph-bounds="450,180,750,360">
<rect id="project" x="450" y="180" width="300" height="180" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="600.0" y="207" text-anchor="middle" fill="#FFFFFF">投影 · 当前锚点</text>
<text class="node-line" x="600.0" y="233" text-anchor="middle" fill="#FFFFFF">锚点 = 鞋底局部点</text>
<text class="node-line" x="600.0" y="256" text-anchor="middle" fill="#FFFFFF">绕开 IMU 朝向旋转</text>
<text class="node-line" x="600.0" y="279" text-anchor="middle" fill="#FFFFFF">position = anchor_xy − contact</text>
<text class="node-line" x="600.0" y="302" text-anchor="middle" fill="#FFFFFF">→ 躯干 position[3]（重力对齐）</text>
</g>
<g data-graph-role="node" data-node-id="scan" data-graph-bounds="450,410,750,600">
<rect id="scan" x="450" y="410" width="300" height="190" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="600.0" y="437" text-anchor="middle" fill="#FFFFFF">候选扫描 · ALPHA16</text>
<text class="node-line" x="600.0" y="463" text-anchor="middle" fill="#FFFFFF">每脚 16 点 · 共 32 点投世界</text>
<text class="node-line" x="600.0" y="486" text-anchor="middle" fill="#FFFFFF">取世界 z 最低者</text>
<text class="node-line" x="600.0" y="509" text-anchor="middle" fill="#FFFFFF">只接受 z &lt; 10mm 的候选</text>
</g>
<g data-graph-role="node" data-node-id="pending" data-graph-bounds="830,280,1130,500">
<rect id="pending" x="830" y="280" width="300" height="220" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="980.0" y="307" text-anchor="middle" fill="#FFFFFF">pending · 锚点切换</text>
<text class="node-line" x="980.0" y="333" text-anchor="middle" fill="#FFFFFF">候选换脚 ⇒ 重新计数</text>
<text class="node-line" x="980.0" y="356" text-anchor="middle" fill="#FFFFFF">同脚连续两拍 ⇒ 确认</text>
<text class="node-line" x="980.0" y="379" text-anchor="middle" fill="#FFFFFF">确认沿用首次候选的</text>
<text class="node-line" x="980.0" y="402" text-anchor="middle" fill="#FFFFFF">局部点与世界 XY</text>
</g>
<g data-graph-role="node" data-node-id="out" data-graph-bounds="830,560,1130,740">
<rect id="out" x="830" y="560" width="300" height="180" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="980.0" y="587" text-anchor="middle" fill="#FFFFFF">估计输出</text>
<text class="node-line" x="980.0" y="613" text-anchor="middle" fill="#FFFFFF">position[3]（相对重力对齐）</text>
<text class="node-line" x="980.0" y="636" text-anchor="middle" fill="#FFFFFF">yaw ← 归一化 IMU quat</text>
<text class="node-line" x="980.0" y="659" text-anchor="middle" fill="#FFFFFF">锚点诊断 foot / switches</text>
<text class="node-line" x="980.0" y="682" text-anchor="middle" fill="#FFFFFF">→ FrameSnapshot.odometry（内部）</text>
</g>
<g data-graph-role="node" data-node-id="rules" data-graph-bounds="80,630,720,850">
<rect id="rules" x="80" y="630" width="640" height="220" rx="8" fill="#475569" stroke="#1E293B" stroke-width="1.8"/>
<text class="node-label" x="400.0" y="657" text-anchor="middle" fill="#FFFFFF">不变量 · 不做的事</text>
<text class="node-line" x="400.0" y="683" text-anchor="middle" fill="#FFFFFF">coasted / blind / !imu_ready ⇒ 估计与 pending 完全不动</text>
<text class="node-line" x="400.0" y="706" text-anchor="middle" fill="#FFFFFF">disable / scheduler reset / Limp / Posing ⇒ 不重建估计器</text>
<text class="node-line" x="400.0" y="729" text-anchor="middle" fill="#FFFFFF">没有 reset 方法 · origin = 首次更新的左脚 site</text>
<text class="node-line" x="400.0" y="752" text-anchor="middle" fill="#FFFFFF">不吃接触力 / 不积分陀螺 / 不吃命令输入</text>
</g>
<rect x="161.4" y="337" width="97.2" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="sample-fk"/>
<text class="edge-label" x="210" y="351" text-anchor="middle">关节角 + quat</text>
<rect x="343.2" y="287" width="103.6" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="fk-project"/>
<text class="edge-label" x="395" y="301" text-anchor="middle">两脚 site 位姿</text>
<rect x="511.9" y="372" width="176.2" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="project-scan"/>
<text class="edge-label" x="600" y="386" text-anchor="middle">两脚 pose + 当前 position</text>
<rect x="758.0" y="427" width="64.0" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="scan-pending"/>
<text class="edge-label" x="790" y="441" text-anchor="middle">最低候选</text>
<rect x="672.2" y="127" width="155.6" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="pending-project"/>
<text class="edge-label" x="750" y="141" text-anchor="middle">确认 ⇒ 换锚点 ⇒ 重投影</text>
<rect x="874.8" y="517" width="130.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="pending-out"/>
<text class="edge-label" x="940" y="531" text-anchor="middle">锚点 + position[3]</text>
<rect x="50" y="930" width="24" height="14" rx="3" fill="#64748B" stroke="#94A3B8"/>
<text class="legend" x="82" y="942">数据 / 控制</text>
<rect x="260" y="930" width="24" height="14" rx="3" fill="#DB2777" stroke="#94A3B8"/>
<text class="legend" x="292" y="942">M9c Bite 2 新增</text>
<rect x="470" y="930" width="24" height="14" rx="3" fill="#94A3B8" stroke="#94A3B8"/>
<text class="legend" x="502" y="942">虚线：异步 / 进程控制</text>
</svg>
