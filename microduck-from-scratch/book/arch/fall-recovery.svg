<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
<style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#0F172A}.subtitle{font-size:15px;fill:#475569}.container-label{font-size:16px;font-weight:700;fill:#334155}.node-label{font-size:16px;font-weight:700}.node-line{font-size:13px}.edge-label{font-size:12px;fill:#334155}.legend{font-size:13px;fill:#475569}</style>
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#64748B"/></marker>
<marker id="arrow-pink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#DB2777"/></marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#D97706"/></marker>
<marker id="arrow-light" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#CBD5E1"/></marker>
</defs>
<rect width="1400" height="1120" fill="#FFFFFF"/>
<text class="title" x="40" y="45">miniduckd · fall-recovery 子模块</text>
<text class="subtitle" x="40" y="75">MINIDUCK_LIMP_FALL=1 opt-in · Safety 仍拥有全部写入 · 无新进程 / RPC / 网络边 / odometry</text>
<rect id="p_daemon" x="40" y="130" width="1320" height="850" rx="12" fill="#F8FAFC" fill-opacity="0.45" stroke="#94A3B8" stroke-width="1.5" data-graph-role="container" data-container-id="p_daemon" data-graph-bounds="40,130,1360,980"/>
<text class="container-label" x="56" y="155">miniduckd · impl/src/fall.rs + control.rs</text>
<path id="control-predictor" d="M 360 285 L 450 285" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="control-predictor" data-source="control" data-target="predictor" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<path id="scheduler-predictor" d="M 360 585 L 410 585 L 410 390 L 450 390" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="scheduler-predictor" data-source="scheduler" data-target="predictor" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="control-reset" d="M 360 365 L 450 365" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="control-reset" data-source="control" data-target="predictor" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<path id="predictor-phases" d="M 800 285 L 900 285" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="predictor-phases" data-source="predictor" data-target="phases" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<path id="phases-landing" d="M 900 430 L 800 430 L 800 600" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="phases-landing" data-source="phases" data-target="landing" data-edge-kind="flow" data-bends="1" data-route-stretch="1"/>
<path id="landing-phases" d="M 800 665 L 880 665 L 880 490 L 900 490" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="landing-phases" data-source="landing" data-target="phases" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="phases-control" d="M 1100 180 L 1100 110 L 220 110 L 220 220" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="phases-control" data-source="phases" data-target="control" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="phases-safety" d="M 1100 560 L 1100 660" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="phases-safety" data-source="phases" data-target="safety" data-edge-kind="flow" data-bends="0" data-route-stretch="1"/>
<path id="safety-control" d="M 900 745 L 60 745 L 60 330 L 80 330" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="safety-control" data-source="safety" data-target="control" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<path id="phases-snapshot" d="M 1300 540 L 1340 540 L 1340 880 L 800 880" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)" data-graph-role="edge" data-edge-id="phases-snapshot" data-source="phases" data-target="snapshot" data-edge-kind="flow" data-bends="2" data-route-stretch="1"/>
<g data-graph-role="node" data-node-id="control" data-graph-bounds="80,220,360,440">
<rect id="control" x="80" y="220" width="280" height="220" rx="8" fill="#EA580C" stroke="#9A3412" stroke-width="1.8"/>
<text class="node-label" x="220.0" y="247" text-anchor="middle" fill="#FFFFFF">control loop · 50Hz</text>
<text class="node-line" x="220.0" y="273" text-anchor="middle" fill="#FFFFFF">fresh IMU samples</text>
<text class="node-line" x="220.0" y="296" text-anchor="middle" fill="#FFFFFF">previous-tick Driving</text>
<text class="node-line" x="220.0" y="319" text-anchor="middle" fill="#FFFFFF">imu_ready + !fallen</text>
<text class="node-line" x="220.0" y="342" text-anchor="middle" fill="#FFFFFF">coasted / blind 检测</text>
</g>
<g data-graph-role="node" data-node-id="scheduler" data-graph-bounds="80,520,360,650">
<rect id="scheduler" x="80" y="520" width="280" height="130" rx="8" fill="#CA8A04" stroke="#854D0E" stroke-width="1.8"/>
<text class="node-label" x="220.0" y="547" text-anchor="middle" fill="#FFFFFF">Scheduler</text>
<text class="node-line" x="220.0" y="573" text-anchor="middle" fill="#FFFFFF">busy / sitting</text>
<text class="node-line" x="220.0" y="596" text-anchor="middle" fill="#FFFFFF">技能调度状态只作 eligibility</text>
</g>
<g data-graph-role="node" data-node-id="predictor" data-graph-bounds="450,200,800,440">
<rect id="predictor" x="450" y="200" width="350" height="240" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="625.0" y="227" text-anchor="middle" fill="#FFFFFF">FallPredictor · fall.rs</text>
<text class="node-line" x="625.0" y="253" text-anchor="middle" fill="#FFFFFF">默认 OFF；env=1 才启用</text>
<text class="node-line" x="625.0" y="276" text-anchor="middle" fill="#FFFFFF">eligible = imu_ready &amp;&amp; !fallen</text>
<text class="node-line" x="625.0" y="299" text-anchor="middle" fill="#FFFFFF">  &amp;&amp; !busy &amp;&amp; !sitting</text>
<text class="node-line" x="625.0" y="322" text-anchor="middle" fill="#FFFFFF">prev tick 必须 Driving</text>
<text class="node-line" x="625.0" y="345" text-anchor="middle" fill="#FFFFFF">ineligible / coasted / blind ⇒ reset</text>
</g>
<g data-graph-role="node" data-node-id="landing" data-graph-bounds="450,520,800,720">
<rect id="landing" x="450" y="520" width="350" height="200" rx="8" fill="#DB2777" stroke="#9D174D" stroke-width="1.8"/>
<text class="node-label" x="625.0" y="547" text-anchor="middle" fill="#FFFFFF">LandingDetector · fall.rs</text>
<text class="node-line" x="625.0" y="573" text-anchor="middle" fill="#FFFFFF">Limp：measured-joint targets · gain50</text>
<text class="node-line" x="625.0" y="596" text-anchor="middle" fill="#FFFFFF">fresh gyro norm &lt; 1 持续 200ms</text>
<text class="node-line" x="625.0" y="619" text-anchor="middle" fill="#FFFFFF">或 1500ms cap</text>
<text class="node-line" x="625.0" y="642" text-anchor="middle" fill="#FFFFFF">完成 ⇒ Posing</text>
</g>
<g data-graph-role="node" data-node-id="phases" data-graph-bounds="900,180,1300,560">
<rect id="phases" x="900" y="180" width="400" height="380" rx="8" fill="#EA580C" stroke="#9A3412" stroke-width="1.8"/>
<text class="node-label" x="1100.0" y="207" text-anchor="middle" fill="#FFFFFF">control.rs · phases</text>
<text class="node-line" x="1100.0" y="233" text-anchor="middle" fill="#FFFFFF">Driving · gain200</text>
<text class="node-line" x="1100.0" y="256" text-anchor="middle" fill="#FFFFFF">  │ fall fire</text>
<text class="node-line" x="1100.0" y="279" text-anchor="middle" fill="#FFFFFF">  ▼</text>
<text class="node-line" x="1100.0" y="302" text-anchor="middle" fill="#FFFFFF">Limp · measured joints · gain50</text>
<text class="node-line" x="1100.0" y="325" text-anchor="middle" fill="#FFFFFF">  │ landed / cap</text>
<text class="node-line" x="1100.0" y="348" text-anchor="middle" fill="#FFFFFF">  ▼</text>
<text class="node-line" x="1100.0" y="371" text-anchor="middle" fill="#FFFFFF">Posing · measured pose → home</text>
<text class="node-line" x="1100.0" y="394" text-anchor="middle" fill="#FFFFFF">600ms · gain160</text>
<text class="node-line" x="1100.0" y="417" text-anchor="middle" fill="#FFFFFF">完成 ⇒ policy feedback reset ⇒ Driving</text>
<text class="node-line" x="1100.0" y="440" text-anchor="middle" fill="#FFFFFF">Limp/Posing disable ⇒ measured-pose hold</text>
</g>
<g data-graph-role="node" data-node-id="safety" data-graph-bounds="900,660,1300,790">
<rect id="safety" x="900" y="660" width="400" height="130" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.8"/>
<text class="node-label" x="1100.0" y="687" text-anchor="middle" fill="#FFFFFF">Safety · safety.rs</text>
<text class="node-line" x="1100.0" y="713" text-anchor="middle" fill="#FFFFFF">唯一 RobotIo 写句柄：所有 targets / gain / hold</text>
<text class="node-line" x="1100.0" y="736" text-anchor="middle" fill="#FFFFFF">gain_pose=160 · imu_ready accessor</text>
<text class="node-line" x="1100.0" y="759" text-anchor="middle" fill="#FFFFFF">fallen 仍只报告，不门控写入</text>
</g>
<g data-graph-role="node" data-node-id="snapshot" data-graph-bounds="450,830,800,930">
<rect id="snapshot" x="450" y="830" width="350" height="100" rx="8" fill="#475569" stroke="#1E293B" stroke-width="1.8"/>
<text class="node-label" x="625.0" y="857" text-anchor="middle" fill="#FFFFFF">FrameSnapshot · existing watch</text>
<text class="node-line" x="625.0" y="883" text-anchor="middle" fill="#FFFFFF">skill = limp_fall / limp_pose</text>
<text class="node-line" x="625.0" y="906" text-anchor="middle" fill="#FFFFFF">moving = true throughout Limp + Posing</text>
</g>
<rect x="247.2" y="172" width="315.6" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="control-predictor"/>
<text class="edge-label" x="405" y="186" text-anchor="middle">fresh IMU + prev Driving + imu_ready + !fallen</text>
<rect x="361.2" y="487" width="117.6" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="scheduler-predictor"/>
<text class="edge-label" x="420" y="501" text-anchor="middle">!busy + !sitting</text>
<rect x="286.8" y="452" width="236.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="control-reset"/>
<text class="edge-label" x="405" y="466" text-anchor="middle">reset：ineligible / coasted / blind</text>
<rect x="814.3" y="252" width="71.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="predictor-phases"/>
<text class="edge-label" x="850" y="266" text-anchor="middle">fall fire</text>
<rect x="814.3" y="402" width="71.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="phases-landing"/>
<text class="edge-label" x="850" y="416" text-anchor="middle">Limp gyro</text>
<rect x="804.4" y="507" width="91.2" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="landing-phases"/>
<text class="edge-label" x="850" y="521" text-anchor="middle">landed / cap</text>
<rect x="448.8" y="87" width="302.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="phases-control"/>
<text class="edge-label" x="600" y="101" text-anchor="middle">Posing done ⇒ policy reset ⇒ Driving gain200</text>
<rect x="980.3" y="607" width="269.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="phases-safety"/>
<text class="edge-label" x="1115" y="621" text-anchor="middle">targets + gain50/160/200 + disable hold</text>
<rect x="338.7" y="722" width="282.6" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="safety-control"/>
<text class="edge-label" x="480" y="736" text-anchor="middle">sensors + imu_ready + fallen（report-only）</text>
<rect x="1027.8" y="857" width="104.4" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.94" data-graph-role="decoration" data-owner="phases-snapshot"/>
<text class="edge-label" x="1080" y="871" text-anchor="middle">skill + moving</text>
<rect x="50" y="1070" width="24" height="14" rx="3" fill="#64748B" stroke="#94A3B8"/>
<text class="legend" x="82" y="1082">数据 / 控制</text>
<rect x="260" y="1070" width="24" height="14" rx="3" fill="#DB2777" stroke="#94A3B8"/>
<text class="legend" x="292" y="1082">M9c 新增</text>
<rect x="470" y="1070" width="24" height="14" rx="3" fill="#94A3B8" stroke="#94A3B8"/>
<text class="legend" x="502" y="1082">虚线：异步 / 进程控制</text>
</svg>
