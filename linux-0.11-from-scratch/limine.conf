# Limine v10.8.5 配置（语法以上游 CONFIG.md 为准：v9 起改用本格式——
# 条目以 "/标题" 开头、选项为 "name: value" 且名不区分大小写、注释必须独占一行）。
# 决策：配置文件放仓库根，由 docker/build.mk 拷进 ISO 的 /boot/limine/limine.conf，
# 那是 Limine 在启动盘上扫描配置的第一个候选位置（CONFIG.md "Location of the config file"）。

timeout: 0
# 直接引导第一个条目，不驻留启动菜单；想进菜单交互，把它改成秒数即可。

serial: yes
# Limine 自身的日志也输出到 COM1（BIOS 下默认 115200），与内核串口输出汇入同一通道，
# 引导阶段出错时能在同一份串口日志里看到原因。

/Linux 0.11 (Rust) M0
    protocol: limine
    kernel_path: boot():/kernel.elf
    # boot(): = 启动盘本身（无分区光盘的整卷），内核放在 ISO 根目录。
