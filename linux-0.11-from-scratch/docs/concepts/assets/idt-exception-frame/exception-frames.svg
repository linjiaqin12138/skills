<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="三种异常入口栈帧，以 RSP 加字节偏移标记每个 8 字节槽位">
  <rect width="1200" height="570" fill="#0f172a"/>
  <defs>
    <marker id="rsp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fde68a"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #f8fafc; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #cbd5e1; }
    .heading { font-size: 16px; font-weight: 700; }
    .offset { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #e2e8f0; }
    .field { font-size: 15px; font-weight: 700; }
    .slot { stroke: #94a3b8; stroke-width: 1; }
    .divider { stroke: #94a3b8; stroke-width: 1; }
    .saved { fill: #1e3a8a; }
    .error { fill: #9a3412; }
    .old-stack { fill: #14532d; }
    .pointer { stroke: #fde68a; stroke-width: 2; }
    .pointer-label { fill: #fde68a; font-size: 13px; }
  </style>
  <text x="30" y="38" class="title">CPU 自动保存的异常栈帧</text>
  <text x="30" y="65" class="subtitle">每格 8 字节 · 高地址在上方 · PUSH：RSP 先减 8，再写 [RSP]</text>

  <g text-anchor="middle" class="heading">
    <text x="200" y="100">不切栈 · 无 error code</text>
    <text x="600" y="100">不切栈 · 有 error code</text>
    <text x="1000" y="100">切栈 · 有 error code</text>
  </g>

  <g>
    <rect x="40" y="300" width="320" height="56" class="slot saved"/>
    <line x1="160" y1="300" x2="160" y2="356" class="divider"/>
    <text x="55" y="335" class="offset">[RSP+16]</text>
    <text x="260" y="335" text-anchor="middle" class="field">saved RFLAGS</text>
    <rect x="40" y="360" width="320" height="56" class="slot saved"/>
    <line x1="160" y1="360" x2="160" y2="416" class="divider"/>
    <text x="55" y="395" class="offset">[RSP+8]</text>
    <text x="260" y="395" text-anchor="middle" class="field">saved CS</text>
    <rect x="40" y="420" width="320" height="56" class="slot saved"/>
    <line x1="160" y1="420" x2="160" y2="476" class="divider"/>
    <text x="55" y="455" class="offset">[RSP+0]</text>
    <text x="260" y="455" text-anchor="middle" class="field">saved RIP</text>
  </g>

  <g>
    <rect x="440" y="240" width="320" height="56" class="slot saved"/>
    <line x1="560" y1="240" x2="560" y2="296" class="divider"/>
    <text x="455" y="275" class="offset">[RSP+24]</text>
    <text x="660" y="275" text-anchor="middle" class="field">saved RFLAGS</text>
    <rect x="440" y="300" width="320" height="56" class="slot saved"/>
    <line x1="560" y1="300" x2="560" y2="356" class="divider"/>
    <text x="455" y="335" class="offset">[RSP+16]</text>
    <text x="660" y="335" text-anchor="middle" class="field">saved CS</text>
    <rect x="440" y="360" width="320" height="56" class="slot saved"/>
    <line x1="560" y1="360" x2="560" y2="416" class="divider"/>
    <text x="455" y="395" class="offset">[RSP+8]</text>
    <text x="660" y="395" text-anchor="middle" class="field">saved RIP</text>
    <rect x="440" y="420" width="320" height="56" class="slot error"/>
    <line x1="560" y1="420" x2="560" y2="476" class="divider"/>
    <text x="455" y="455" class="offset">[RSP+0]</text>
    <text x="660" y="455" text-anchor="middle" class="field">error code</text>
  </g>

  <g>
    <rect x="840" y="120" width="320" height="56" class="slot old-stack"/>
    <line x1="960" y1="120" x2="960" y2="176" class="divider"/>
    <text x="855" y="155" class="offset">[RSP+40]</text>
    <text x="1060" y="155" text-anchor="middle" class="field">old SS</text>
    <rect x="840" y="180" width="320" height="56" class="slot old-stack"/>
    <line x1="960" y1="180" x2="960" y2="236" class="divider"/>
    <text x="855" y="215" class="offset">[RSP+32]</text>
    <text x="1060" y="215" text-anchor="middle" class="field">old RSP</text>
    <rect x="840" y="240" width="320" height="56" class="slot saved"/>
    <line x1="960" y1="240" x2="960" y2="296" class="divider"/>
    <text x="855" y="275" class="offset">[RSP+24]</text>
    <text x="1060" y="275" text-anchor="middle" class="field">saved RFLAGS</text>
    <rect x="840" y="300" width="320" height="56" class="slot saved"/>
    <line x1="960" y1="300" x2="960" y2="356" class="divider"/>
    <text x="855" y="335" class="offset">[RSP+16]</text>
    <text x="1060" y="335" text-anchor="middle" class="field">saved CS</text>
    <rect x="840" y="360" width="320" height="56" class="slot saved"/>
    <line x1="960" y1="360" x2="960" y2="416" class="divider"/>
    <text x="855" y="395" class="offset">[RSP+8]</text>
    <text x="1060" y="395" text-anchor="middle" class="field">saved RIP</text>
    <rect x="840" y="420" width="320" height="56" class="slot error"/>
    <line x1="960" y1="420" x2="960" y2="476" class="divider"/>
    <text x="855" y="455" class="offset">[RSP+0]</text>
    <text x="1060" y="455" text-anchor="middle" class="field">error code</text>
  </g>

  <g>
    <line x1="200" y1="510" x2="200" y2="484" class="pointer" marker-end="url(#rsp-arrow)"/>
    <line x1="600" y1="510" x2="600" y2="484" class="pointer" marker-end="url(#rsp-arrow)"/>
    <line x1="1000" y1="510" x2="1000" y2="484" class="pointer" marker-end="url(#rsp-arrow)"/>
    <text x="200" y="540" text-anchor="middle" class="pointer-label">handler 入口 RSP</text>
    <text x="600" y="540" text-anchor="middle" class="pointer-label">handler 入口 RSP</text>
    <text x="1000" y="540" text-anchor="middle" class="pointer-label">handler 入口 RSP</text>
  </g>
</svg>
