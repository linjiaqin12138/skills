<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <rect width="1100" height="560" fill="#f8fafc"/>
  <style>
    text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.5; }
  </style>
  <text x="30" y="42" class="title">CPU 自动保存的异常栈帧</text>
  <text x="30" y="68" class="small">每格 8 字节；偏移相对 handler 入口的 RSP，高地址在上方</text>

  <text x="180" y="110" text-anchor="middle" class="label">同特权级 · 无 error code</text>
  <rect x="50" y="140" width="260" height="55" fill="#e2e8f0" class="box"/><text x="180" y="174" text-anchor="middle" class="label">RFLAGS · +16</text>
  <rect x="50" y="195" width="260" height="55" fill="#e2e8f0" class="box"/><text x="180" y="229" text-anchor="middle" class="label">CS · +8</text>
  <rect x="50" y="250" width="260" height="55" fill="#bfdbfe" class="box"/><text x="180" y="284" text-anchor="middle" class="label">RIP · +0 ← RSP</text>
  <text x="180" y="340" text-anchor="middle" class="small">fault 的 RIP 指向犯错指令</text>

  <text x="550" y="110" text-anchor="middle" class="label">同特权级 · 有 error code</text>
  <rect x="420" y="140" width="260" height="55" fill="#e2e8f0" class="box"/><text x="550" y="174" text-anchor="middle" class="label">RFLAGS · +24</text>
  <rect x="420" y="195" width="260" height="55" fill="#e2e8f0" class="box"/><text x="550" y="229" text-anchor="middle" class="label">CS · +16</text>
  <rect x="420" y="250" width="260" height="55" fill="#e2e8f0" class="box"/><text x="550" y="284" text-anchor="middle" class="label">RIP · +8</text>
  <rect x="420" y="305" width="260" height="55" fill="#fde68a" class="box"/><text x="550" y="339" text-anchor="middle" class="label">error code · +0 ← RSP</text>
  <text x="550" y="395" text-anchor="middle" class="small">入口可补占位 0，统一两种布局</text>

  <text x="900" y="110" text-anchor="middle" class="label">特权级切换 · 有 error code</text>
  <rect x="770" y="140" width="260" height="45" fill="#dcfce7" class="box"/><text x="900" y="169" text-anchor="middle" class="label">旧 SS · +40</text>
  <rect x="770" y="185" width="260" height="45" fill="#dcfce7" class="box"/><text x="900" y="214" text-anchor="middle" class="label">旧 RSP · +32</text>
  <rect x="770" y="230" width="260" height="45" fill="#e2e8f0" class="box"/><text x="900" y="259" text-anchor="middle" class="label">RFLAGS · +24</text>
  <rect x="770" y="275" width="260" height="45" fill="#e2e8f0" class="box"/><text x="900" y="304" text-anchor="middle" class="label">CS · +16</text>
  <rect x="770" y="320" width="260" height="45" fill="#e2e8f0" class="box"/><text x="900" y="349" text-anchor="middle" class="label">RIP · +8</text>
  <rect x="770" y="365" width="260" height="45" fill="#fde68a" class="box"/><text x="900" y="394" text-anchor="middle" class="label">error code · +0 ← RSP</text>
  <text x="900" y="445" text-anchor="middle" class="small">只有特权级切换才保存旧 SS/RSP</text>

  <text x="30" y="515" class="small">handler 先读取这些字段，再决定恢复执行或停机；返回时使用 iretq</text>
</svg>
